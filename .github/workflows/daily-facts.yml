name: Daily Animal Facts Update

on:
  schedule:
    - cron: '48 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate daily animal facts
        run: node generate-daily.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Daily Facts Bot"

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add facts.js
            git commit -m "Daily: Add 5 new animal facts ($(date '+%Y-%m-%d'))"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
