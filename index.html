<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动物小知识漫画</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: "ZCOOL KuaiLe", "HanziPen SC", "Yuanti SC", "PingFang SC", sans-serif;
      background: #fff3e6 radial-gradient(rgba(255, 170, 130, 0.25) 2px, transparent 2px) 0 0 / 24px 24px;
      color: #4a3434;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    h1 { margin: 0 0 4px; font-weight: normal; font-size: 36px; }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(120, 70, 50, 0.18);
    }
    .buttons { margin: 16px 0 20px; display: flex; gap: 14px; }
    button {
      font-family: inherit;
      font-size: 18px;
      padding: 10px 22px;
      border: 3px solid #4a3434;
      border-radius: 999px;
      cursor: pointer;
      background: #8fe0c8;
      color: #4a3434;
      box-shadow: 0 4px 0 #4a3434;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button.secondary { background: #ffc078; }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #4a3434; }
  </style>
</head>
<body>
  <h1>🐾 每日动物小知识</h1>
  <div class="buttons">
    <button id="next">换一个 🎲</button>
    <button id="video">生成视频 🎬</button>
    <button id="download" class="secondary">下载漫画 ⬇️</button>
  </div>
  <canvas id="comic"></canvas>

  <script src="characters.js"></script>
  <script src="facts.js"></script>
  <script src="comic.js"></script>
</body>
</html>
